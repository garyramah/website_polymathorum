<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polymathorum</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #1d2433;
        --muted: #58657a;
        --accent: #4f46e5;
        --accent-2: #0ea5e9;
        --border: #e5e7eb;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, var(--bg) 100%);
        color: var(--ink);
      }

      .container {
        width: min(1100px, calc(100% - 2rem));
        margin: 0 auto;
      }

      header {
        padding: 1.25rem 0;
      }

      nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .brand {
        font-size: 1.25rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .nav-links {
        display: flex;
        gap: 1.25rem;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .nav-links a {
        color: inherit;
        text-decoration: none;
      }

      .hero {
        min-height: 72vh;
        display: grid;
        place-items: center;
      }

      .hero-card {
        width: min(900px, 100%);
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(6px);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(79, 70, 229, 0.08);
        padding: clamp(2rem, 5vw, 4rem);
      }

      .eyebrow {
        display: inline-block;
        background: rgba(79, 70, 229, 0.1);
        color: var(--accent);
        border-radius: 999px;
        padding: 0.45rem 0.8rem;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      h1 {
        font-size: clamp(2.5rem, 6vw, 4.75rem);
        line-height: 0.98;
        margin: 1rem 0 1rem;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        max-width: 680px;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .button {
        display: inline-block;
        text-decoration: none;
        border-radius: 999px;
        padding: 0.9rem 1.4rem;
        font-weight: 700;
        transition: transform 0.2s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button.primary {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }

      .button.secondary {
        background: #fff;
        color: var(--ink);
        border: 1px solid var(--border);
      }

      @media (max-width: 640px) {
        nav {
          flex-direction: column;
          align-items: flex-start;
        }

        .nav-links {
          gap: 0.7rem;
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <div class="brand">Polymathorum</div>
          <div class="nav-links">
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
          </div>
        </nav>
      </div>
    </header>

    <main class="hero">
      <div class="container">
        <section class="hero-card" id="about">
          <span class="eyebrow">Creative platform</span>
          <h1>Ideas, research, and knowledge in one place.</h1>
          <p>
            Polymathorum brings together thoughtful writing, exploration, and shared learning.
            This minimal landing page is the starting point for a broader digital presence.
          </p>
          <div class="actions">
            <a class="button primary" href="#projects">Explore</a>
            <a class="button secondary" href="#contact">Get in touch</a>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
